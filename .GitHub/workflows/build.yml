name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools python3-wheel \
            git zip unzip openjdk-17-jdk zlib1g-dev libncurses5-dev libffi-dev \
            libssl-dev libsqlite3-dev

      - name: Install Buildozer
        run: |
          pip3 install --upgrade Cython virtualenv
          pip3 install --upgrade buildozer

      - name: Build APK using Buildozer
        run: |
          buildozer android debug

      - name: Find generated APK
        id: apk
        run: |
          apk_path=$(find . -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No APK was generated!"
            exit 1
          fi
          echo "apk_path=$apk_path" >> $GITHUB_OUTPUT
          echo "APK found at: $apk_path"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizApp-APK
          path: ${{ steps.apk.outputs.apk_path }}