name: Build APK (Docker buildozer)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show python & buildozer
        run: |
          python3 --version
          pip --version
          buildozer --version || true
          which sdkmanager || true

      - name: Ensure buildozer.spec exists
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found at repo root" && ls -la && exit 1
          fi

      - name: Run buildozer (android debug)
        run: |
          # This container runs buildozer and has Android SDK preconfigured
          buildozer -v android debug || ( echo "BUILD FAILED"; exit 1 )

      - name: List output files
        run: |
          pwd
          find . -type f \( -iname "*.apk" -o -iname "*.aab" \) -print || true

      - name: Upload apk/aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: |
            $(find . -type f -iname "*.apk" -o -iname "*.aab" || true)