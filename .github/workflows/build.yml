name: Build APK

# Manual trigger from Actions UI
on:
  workflow_dispatch:

jobs:
  build-apk:
    # Use an image that already has buildozer & Android toolchain preinstalled
    # (kivy/buildozer is commonly used for CI builds)
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python & Buildozer info (debug)
        run: |
          python --version || true
          pip --version || true
          buildozer --version || true

      - name: Ensure latest pip and install python build deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install/upgrade buildozer inside container (safe)
          pip install --upgrade buildozer

      - name: (Optional) list files (debug)
        run: |
          echo "Repository files:"
          ls -la

      - name: Build APK (debug)
        # IMPORTANT: accept root warning so buildozer won't prompt for input in CI
        run: |
          # Clean previous builds (safe)
          buildozer --accept-buildozer-root-warning android clean || true
          # Build debug APK
          buildozer --accept-buildozer-root-warning android debug
        # increase timeout if your build takes long (default 6 hours OK)

      - name: Upload generated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quizapp-apk
          path: |
            bin/*.apk
            bin/*.aab
