name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      apk_path: "bin/*.apk"   # <-- change if your APK is in another folder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- (your build steps go here) ----------
      # replace with steps to build your app and produce the APK into bin/ or dist/
      - name: Setup Python / Build (placeholder)
        run: |
          echo "Place your build commands here"
          # example: build commands that create the APK at ${GITHUB_WORKSPACE}/bin/app.apk
      # -------------------------------------------------

      - name: Check for APK
        id: check_apk
        run: |
          shopt -s nullglob || true
          files=( ${{ env.apk_path }} )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no_apk=true" >> $GITHUB_OUTPUT
            echo "No APK found at path: ${{ env.apk_path }}"
            exit 1
          else
            echo "no_apk=false" >> $GITHUB_OUTPUT
            echo "Found APK(s): ${files[*]}"
          fi

      - name: Upload APK artifact (primary)
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizApp-APK
          path: ${{ env.apk_path }}
        # keep job running even if upload-artifact has issues so fallback can try
        continue-on-error: true

      # Fallback: if upload-artifact failed, create a release and attach the APK
      - name: Create fallback GitHub Release (only on artifact failure)
        if: steps.upload_artifact.outcome == 'failure' && steps.check_apk.outputs.no_apk != 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: apk-fallback-${{ github.run_id }}
          name: "QuizApp APK (fallback) ${{ github.run_id }}"
          body: "Fallback release created because artifact upload failed."

      - name: Upload APK to Release (fallback)
        if: steps.upload_artifact.outcome == 'failure' && steps.check_apk.outputs.no_apk != 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Final status
        run: |
          if [ "${{ steps.check_apk.outcome }}" != "success" ]; then
            echo "No APK produced — check build steps."
            exit 1
          fi
          if [ "${{ steps.upload_artifact.outcome }}" == "success" ]; then
            echo "APK uploaded as artifact successfully."
          else
            echo "Artifact upload failed; fallback release used."
          fi
