name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages (apt)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-venv python3-dev build-essential \
            openjdk-17-jdk curl unzip zip git wget \
            libncurses5-dev libssl-dev libsqlite3-dev libffi-dev libbz2-dev liblzma-dev

      - name: Upgrade pip and install python deps
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          # Cython usually required for some python-for-android modules
          python3 -m pip install cython==0.29.36 virtualenv

      - name: Install buildozer (stable on PyPI)
        run: |
          # Use the latest stable Buildozer available on PyPI (1.5.0 is widely used)
          python3 -m pip install buildozer==1.5.0
          # optional: python-for-android dependencies (will be downloaded during build)
          python3 -m pip show buildozer

      - name: Show env & versions (debug)
        run: |
          echo "WORKDIR: $(pwd)"
          python3 --version
          pip --version
          java -version || true
          buildozer --version || true

      - name: Run buildozer (android debug)
        env:
          # optional: override to avoid interactive prompts (if any)
          P4A_BOOTSTRAP: sdl2
        run: |
          # run build (this produces large logs)
          # If you want a faster first try, set target to 'android debug' as below
          buildozer -v android debug

      - name: Show generated files (debug)
        run: |
          echo "PWD: $(pwd)"
          echo "Top-level:"
          ls -la
          echo "Look for apk/aab in common locations:"
          find . -type f \( -iname "*.apk" -o -iname "*.aab" \) -print || true

      - name: Upload package artifact (if any)
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: |
            bin/*.apk
            bin/*.aab
            **/bin/*.apk
            **/bin/*.aab