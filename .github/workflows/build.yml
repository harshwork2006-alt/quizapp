name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    #---------------- CHECKOUT ----------------#
    - name: Checkout
      uses: actions/checkout@v4

    #---------------- JAVA ----------------#
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    #---------------- SYSTEM PACKAGES ----------------#
    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          python3-setuptools \
          python3-wheel \
          unzip \
          zip \
          curl \
          libssl-dev \
          libffi-dev \
          libncurses5 \
          libncurses5-dev \
          zlib1g-dev

    #---------------- ANDROID SDK ----------------#
    - name: Install Android SDK + Commandline Tools
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools

        cd $ANDROID_HOME/cmdline-tools
        curl -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip tools.zip
        rm tools.zip

        mv cmdline-tools latest

        echo "export ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
        echo "export PATH=$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV

    #---------------- ACCEPT LICENSES ----------------#
    - name: Accept Android licenses
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --update
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    #---------------- INSTALL BUILDOZER ----------------#
    - name: Install Buildozer + Dependencies
      run: |
        python3 -m pip install --upgrade pip setuptools wheel Cython virtualenv
        python3 -m pip install buildozer==1.5.0

    #---------------- RUN BUILDOZER ----------------#
    - name: Run Buildozer (Android Debug)
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        buildozer -v android debug

    #---------------- FIND APK ----------------#
    - name: Show generated files
      run: |
        echo "APK Files Found:"
        find . -type f -iname "*.apk" -print || echo "No APK Found!"

    #---------------- UPLOAD ARTIFACT ----------------#
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: quizapp-apk
        path: |
          **/*.apk