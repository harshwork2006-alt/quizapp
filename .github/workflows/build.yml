name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      PATH: ${{ runner.temp }}/android-sdk/cmdline-tools/latest/bin:${{ runner.temp }}/android-sdk/platform-tools:${{ env.PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apt packages (system deps)
        run: |
          sudo apt-get update -y
          # some package names differ across images; we try safe set
          sudo apt-get install -y python3-pip python3-venv unzip curl git openjdk-17-jdk \
            libssl-dev libsqlite3-dev libffi-dev zlib1g-dev libncurses-dev || true

      - name: Install Python tools & buildozer (use stable 1.5.0)
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install --upgrade virtualenv
          # buildozer 2.0.0 often not on PyPI; use 1.5.0 (stable)
          python3 -m pip install buildozer==1.5.0 Cython || true

      - name: Install Android commandline tools (sdkmanager)
        run: |
          SDKROOT="${{ runner.temp }}/android-sdk"
          mkdir -p "$SDKROOT/cmdline-tools"
          cd "$SDKROOT/cmdline-tools"
          # download a stable commandline tools zip - filename may update over time
          curl -L -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip
          unzip -q cmdline.zip -d tmp
          rm cmdline.zip
          # move into "latest" and avoid nested-move errors
          mkdir -p latest
          if [ -d tmp/cmdline-tools ]; then
            mv tmp/cmdline-tools/* latest/ || true
          else
            mv tmp/* latest/ || true
          fi
          rm -rf tmp
          chmod +x "$SDKROOT"/cmdline-tools/latest/bin/* || true
          echo "SDK installed to $SDKROOT"

      - name: Accept licenses and install platform/build-tools
        run: |
          SDKROOT="${{ runner.temp }}/android-sdk"
          export ANDROID_SDK_ROOT="$SDKROOT"
          export PATH="$SDKROOT/cmdline-tools/latest/bin:$SDKROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$SDKROOT" --licenses || true
          sdkmanager --sdk_root="$SDKROOT" --update
          # install platform-tools and a stable build-tools/platform
          sdkmanager --sdk_root="$SDKROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

      - name: Show environment & installed sdk components
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "${{ runner.temp }}/android-sdk" || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list || true

      - name: Run buildozer (android debug)
        run: |
          # make sure we run buildozer as a non-root user to avoid interactive root check
          # GitHub runner is not root by default, so just run buildozer.
          echo "python: $(python3 --version)"
          echo "buildozer: $(which buildozer || true)"
          # Run build (will produce logs). Buildozer reads buildozer.spec in repo root.
          buildozer -v android debug || ( echo "BUILD FAILED -- check logs above"; exit 1 )

      - name: List generated files
        run: |
          echo "PWD: $(pwd)"
          echo "Top-level:"
          ls -la
          echo "Find apk/aab:"
          find . -type f \( -iname "*.apk" -o -iname "*.aab" \) -print || true

      - name: Upload package artifact (if any)
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: |
            $(find . -type f -iname "*.apk" -o -iname "*.aab" || true)